name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Static checks
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Visual kit test
        run: npm run test:kit
      - name: Browser tests
        run: npm run test:browser
      - name: Build plugin ZIP
        run: npm run build:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: condisco-plugin
          path: dist/condisco-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: app/tests/shots/
          if-no-files-found: ignore
