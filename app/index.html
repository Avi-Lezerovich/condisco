<title>Condisco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="claude-artifacts-manifest">{"permissions": []}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Condisco, the study partner app (successor of Study Hub, same look: "morning at the lake").
   LAYOUT: one column up to 720px with an icon tab bar at the bottom; from 1100px a side rail and a two-column Today.
   COLOUR: cool morning ground, deep ink, cobalt for actions, highlighter yellow only for wins. Dark = lake at night,
   no pure black or white, desaturated accents. TYPE: Secular One for display and numbers, Assistant for text. */
:root{color-scheme:light dark;
--bg:light-dark(#f2f5f7,#121820);--surface:light-dark(#ffffff,#1a222c);--sunk:light-dark(#e8edf1,#161d26);
--ink:light-dark(#1b2532,#e2e7ec);--muted:light-dark(#5b6876,#9ba7b4);--line:light-dark(#dbe2e8,#28323e);
--accent:light-dark(#3a60d8,#93abf5);--accent-ink:light-dark(#ffffff,#121820);
--win:light-dark(#f7d04a,#e6c25c);--win-ink:#1f1b08;--warn:light-dark(#bb4430,#ef9584);--now:light-dark(#d9452f,#f08a78);
--ok:light-dark(#1f7a4c,#6fcf9b);--hero:light-dark(#1b2532,#202c3a);--hero-ink:light-dark(#f2f5f7,#e9edf1);--hero-line:light-dark(transparent,#2b3848);
--course-1:#3a60d8;--course-2:#1f8a70;--course-3:#c0602a;--course-4:#8a4fbf;--course-5:#b8366b;--course-6:#2a8bb0;--course-7:#7a8a1f;--course-8:#7a8699;
--scene-sky:light-dark(#dfe8f0,#14243a);--scene-far:light-dark(#9fb4c9,#1d3452);--scene-mid:light-dark(#6f86a8,#16283d);--scene-near:light-dark(#3f5a7a,#0c1724);--scene-accent:light-dark(#f4c98a,#e9dcb5);--scene-ink:light-dark(#1b2532,#e2e7ec);
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:48px;
--r-lg:22px;--r-md:16px;--r-sm:12px;
--f-d:"Secular One","Assistant",system-ui,sans-serif;--f-b:"Assistant",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,#focus::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 var(--f-b);overflow-x:clip;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
body.locked{overflow:hidden}
h1,h2,h3{font-family:var(--f-d);font-weight:400;line-height:1.1;margin:0;text-wrap:balance}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding-block:18px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums}
[style*="--c-raw"]{--c:light-dark(var(--c-raw),color-mix(in srgb,var(--c-raw) 62%,#ffffff))}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) body{font-weight:500}}
:root[data-theme=dark] body{font-weight:500}
.hint{font-size:14px;color:var(--muted);margin:0}.hint.sub{margin:-4px 2px var(--s2)}
.stack{display:grid;gap:var(--s2)}.stack-lg{display:grid;gap:var(--s4)}.center{display:flex;justify-content:center}
.inrow{display:flex;gap:var(--s2);align-items:center}.inrow .f{flex:1}

/* header */
.top{display:flex;align-items:center;gap:var(--s3);margin-bottom:6px}
.mark{width:34px;height:34px;flex:none}
.brand{font-family:var(--f-d);font-size:18px;letter-spacing:.2px}
.top .date{margin-inline-start:auto;color:var(--muted);font-size:15px;white-space:nowrap}
.hello{font-size:clamp(30px,7.5vw,42px);margin:10px 0 16px}
.ambbtn{display:inline-flex;align-items:center;gap:var(--s2)}.ambbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* next-up hero */
.next{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--c,var(--accent)) 22%,transparent),transparent 60%),var(--hero);color:var(--hero-ink);border-radius:var(--r-lg);padding:18px 20px 16px;margin-bottom:var(--s4);position:relative;overflow:hidden;border:1px solid var(--hero-line)}
.next::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:8px;background:var(--c,var(--accent))}
.next .lbl{font-size:14px;opacity:.75}
.next h2{font-size:clamp(22px,5.2vw,28px);margin:4px 0 8px;color:var(--hero-ink)}
.next .row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;font-size:15px;opacity:.9}
.next .cd{font-family:var(--f-d);font-size:24px;line-height:1;white-space:nowrap}
.next .cdw{display:inline-flex;gap:var(--s2)}
.next .min{margin-top:10px;font-size:14.5px;opacity:.85}
.next .acts{margin-top:14px}
.next .btn{border-color:color-mix(in srgb,var(--hero-ink) 30%,transparent);color:var(--hero-ink)}
.next .btn.primary{background:var(--win);color:var(--win-ink);border-color:var(--win)}
.next.calm{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.next.calm::after{display:none}.next.calm h2{color:var(--ink)}

/* week, habits, deadline shelf */
.week{display:flex;margin:0 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.week div{flex:1;padding:10px 14px}.week div+div{border-inline-start:1px solid var(--line)}
.week b{display:block;font-family:var(--f-d);font-weight:400;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.week span{color:var(--muted);font-size:13px}
.shelf{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin-bottom:var(--s3)}
.shelf.wrapw{flex-wrap:wrap;overflow:visible}
.pill{flex:none;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 12px;display:flex;gap:var(--s2);align-items:center;font-size:15px}
.pill .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.pill .ck svg{width:12px;height:12px;opacity:0}
.pill small{color:var(--muted);font-size:12.5px}
.pill[aria-pressed=true]{background:var(--win);border-color:var(--win);color:var(--win-ink)}
.pill[aria-pressed=true] .ck{border-color:var(--win-ink);background:var(--win-ink)}
.pill[aria-pressed=true] .ck svg{opacity:1;stroke:var(--win)}
.pill[aria-pressed=true] small{color:var(--win-ink);opacity:.7}
.due{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 12px;border-radius:var(--r-sm);background:var(--sunk);font-size:14.5px}
.due b{font-family:var(--f-d);font-weight:400;font-size:22px;line-height:1;color:var(--c)}
.due.hot b{color:var(--warn)}
.due span{display:grid;line-height:1.25}.due small{color:var(--muted);font-size:12.5px}

/* spaced review card */
.rev{background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:var(--r-md);padding:12px 14px;margin-bottom:var(--s3);display:grid;gap:6px}
.rev .lbl{font-size:13.5px;color:var(--muted);font-weight:700}
.rev .acts{align-items:center}

/* day switcher + timeline */
.days{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;margin:6px 0 12px;padding:var(--s1);background:var(--sunk);border-radius:var(--r-md)}
.day{flex:1 0 auto;min-width:54px;min-height:50px;border:0;background:transparent;border-radius:12px;padding:6px 8px;line-height:1.15;font-size:14px;color:var(--muted)}
.day b{display:block;font-family:var(--f-d);font-weight:400;font-size:17px;color:var(--ink)}
.day[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.day.has::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:3px auto 0}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);margin:8px 2px}
.dayhead h2{font-size:22px}.dayhead span{color:var(--muted);font-size:14.5px;white-space:nowrap}
.tl{position:relative;padding:4px 0}
.tl::before{content:"";position:absolute;inset-inline-start:79px;top:12px;bottom:12px;width:2px;background:var(--line)}
.slot{display:grid;grid-template-columns:64px 32px minmax(0,1fr);align-items:start;padding:8px 0}
.slot .time{font-family:var(--f-d);font-size:19px;text-align:end;padding-top:12px;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}
.slot .node{position:relative;height:100%}
.slot .node i{position:absolute;inset-inline-start:9px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--c)}
.slot.done .node i,.slot.min .node i{background:var(--c)}
.slot.skipped .node i{border-style:dashed;opacity:.6}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.slot.is-next .card{border-color:var(--c);border-inline-start-width:5px}
.t-title{font-weight:700;font-size:16.5px;line-height:1.35}
.slot.done .t-title{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.slot.min .t-title,.slot.skipped .t-title{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--muted);font-size:14px;margin-top:2px}
.meta .cn{color:var(--c);font-weight:700}
.tag{display:inline-block;background:var(--win);color:var(--win-ink);font-size:12px;font-weight:800;border-radius:6px;padding:1px 7px;margin-inline-end:6px;vertical-align:2px}
.ifthen,.minv{font-size:14px;margin-top:6px;color:var(--muted)}
.ifthen b,.minv b{color:var(--ink);font-weight:700}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{min-height:44px;min-width:44px;border:1px solid var(--line);background:transparent;border-radius:var(--r-sm);padding:0 14px;font-size:15px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on{background:var(--win);color:var(--win-ink);border-color:var(--win)}
.btn:disabled{opacity:.55}
.recall{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.recall .btn{min-height:38px;font-size:14px;padding:0 12px}
.nowline{display:grid;grid-template-columns:64px 32px minmax(0,1fr);align-items:center;margin:2px 0}
.nowline span{font-family:var(--f-d);color:var(--now);text-align:end;font-size:14px;direction:ltr}
.nowline i{justify-self:center;width:12px;height:12px;border-radius:50%;background:var(--now);box-shadow:0 0 0 4px color-mix(in srgb,var(--now) 22%,transparent)}
.nowline hr{border:0;height:2px;background:var(--now);margin:0;opacity:.8}
.sec{font-size:19px;margin:24px 2px 8px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-md);padding:22px 18px;color:var(--muted);text-align:center}
.sugg{display:grid;gap:var(--s2)}
.sg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:center;background:var(--surface);border:1px dashed var(--line);border-inline-start:4px solid var(--c);border-radius:var(--r-md);padding:10px 14px}

/* gap map */
.course{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:var(--s3);overflow:hidden}
.c-head{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;text-align:start;border:0;background:transparent;padding:16px 18px}
.c-head .pct{font-family:var(--f-d);font-size:26px}
.ladder{grid-column:1/-1;display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.ladder span{display:block;height:100%}
.c-sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:14px}
.c-sub .warn{color:var(--warn);font-weight:700}.c-sub .ok{color:var(--ok);font-weight:700}
.mk-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mk{display:inline-flex;gap:6px;align-items:baseline;background:var(--sunk);border-radius:10px;padding:4px 10px;font-size:13.5px;color:var(--muted)}
.mk b{font-family:var(--f-d);font-weight:400;font-size:18px;color:var(--warn)}.mk.ok b{color:var(--ok)}
.mk-form{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:var(--s2);align-items:center;margin-top:var(--s2)}
.mk-tm{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.mk-tm input{width:20px;height:20px}
.err{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);margin:0 2px 14px}
.units{border-top:1px solid var(--line);padding:4px 0 8px}
.kind{font-size:13.5px;color:var(--muted);font-weight:700;padding:10px 18px 2px}
.unit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:8px 18px;align-items:center}
.u-name{font-weight:700}.u-name small{font-weight:400;color:var(--muted);margin-inline-start:4px}
.miss{display:inline-block;background:var(--win);color:var(--win-ink);font-size:12px;font-weight:800;border-radius:6px;padding:0 6px;margin-inline-start:6px}
.flink{font-size:14px;font-weight:700;color:var(--accent);margin-inline-start:8px;white-space:nowrap}
.u-ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.st{min-height:40px;border-radius:999px;border:1.5px solid var(--line);background:transparent;padding:0 14px;font-size:14px;font-weight:600}
.st[data-s=read]{border-color:var(--c);color:var(--c)}
.st[data-s=example]{background:color-mix(in srgb,var(--c) 14%,transparent);border-color:var(--c)}
.st[data-s=solo]{background:color-mix(in srgb,var(--c) 34%,transparent);border-color:var(--c);font-weight:800}
.st[data-s=exam]{background:var(--c);color:var(--accent-ink);border-color:var(--c);font-weight:800}
.conf{display:flex}
.conf button{width:26px;height:40px;border:0;background:transparent;padding:0;display:grid;place-items:center}
.conf button i{width:11px;height:11px;border-radius:50%;border:2px solid var(--c);display:block}
.conf button.f i{background:var(--c)}
.goal{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;margin-bottom:14px;font-size:15px}
.goal b{flex:none;font-family:var(--f-d);font-weight:400;font-size:30px;line-height:1;color:var(--accent)}

/* deadlines */
.toggle{display:inline-flex;gap:var(--s1);margin:0 0 14px;padding:var(--s1);background:var(--sunk);border-radius:var(--r-md)}
.toggle .btn{border:0;min-height:40px}
.toggle .btn.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.badge{display:inline-block;font-size:12px;border:1px dashed var(--muted);color:var(--muted);border-radius:6px;padding:0 6px;margin-inline-start:6px;white-space:nowrap;font-weight:600}

/* forms: check-in, settings, first run */
form.ci{display:grid;gap:var(--s3)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:var(--s2)}
.q>span,.q label>span{font-family:var(--f-d);font-size:17px}
.q small{color:var(--muted);font-size:13.5px;margin-top:-6px}
textarea,input.f,select.f{font:16px/1.5 var(--f-b);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%}
textarea{min-height:68px;resize:vertical}
input.f,select.f{min-height:46px}
.energy{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row2 label,.card-sec>label{display:grid;gap:var(--s1);font-size:14px;color:var(--muted)}
.card-sec label small{font-size:13px}
.note{background:color-mix(in srgb,var(--win) 30%,var(--surface));border-radius:var(--r-md);padding:12px 16px;margin-bottom:var(--s3);font-size:15px}
.card-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s4);display:grid;gap:var(--s3)}
.card-sec h3{font-size:20px}
.cdot{width:12px;height:12px;border-radius:4px;background:var(--c)}
.first .lead{font-size:18px;margin:0 0 var(--s4)}

/* tools row */
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2);margin:0 0 14px}
.tool{min-height:64px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);display:grid;place-items:center;gap:2px;font-size:13.5px;font-weight:700;padding:8px 4px;text-align:center}
.tool svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* focus overlay */
#focus{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;overflow-y:auto;scrollbar-width:none}
#focus.open{display:block}
.fz{max-width:560px;margin:0 auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));min-height:100%;display:flex;flex-direction:column;gap:var(--s4)}
.fz-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.steps{display:flex;gap:6px}.steps i{width:28px;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--accent)}
.fz h2{font-size:clamp(26px,6.5vw,34px)}
.fz .task{color:var(--muted);font-size:15px}.fz .task b{color:var(--ink)}
.chk{display:flex;gap:var(--s3);align-items:center;min-height:56px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:16px;text-align:start;width:100%}
.chk .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.chk .ck svg{width:15px;height:15px;opacity:0;stroke:var(--win-ink)}
.chk[aria-pressed=true]{border-color:var(--win)}
.chk[aria-pressed=true] .ck{background:var(--win);border-color:var(--win)}
.chk[aria-pressed=true] .ck svg{opacity:1}
.snd{display:inline-flex;gap:var(--s2);align-items:center}
.snd svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.big{font-family:var(--f-d);font-size:clamp(64px,22vw,110px);line-height:1;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.phase{text-align:center;color:var(--muted);font-size:16px}
.choices{display:flex;flex-wrap:wrap;gap:var(--s2)}.choices.center{justify-content:center}
.music{display:grid;gap:var(--s2)}
.music a,.mlink{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;width:100%;text-align:start}
.music small{color:var(--muted);font-weight:400}
.fz .foot{margin-top:auto;display:flex;gap:var(--s2);flex-wrap:wrap}
.fz .foot .btn{flex:1}

/* wide screens */
.narrow{max-width:820px}
@media(min-width:1100px){
  body{padding-bottom:24px;padding-inline-start:104px}
  .wrap{max-width:1240px;padding-block-start:26px}
  .hello{font-size:46px;margin:8px 0 22px}
  .main .days{margin-top:0}
  .cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  .cgrid .course{margin:0}
  body nav.tabs{top:0;bottom:0;inset-inline-start:0;inset-inline-end:auto;width:104px;grid-template-columns:1fr;grid-auto-rows:84px;align-content:center;gap:var(--s2);padding:16px 10px;border-top:0;border-inline-end:1px solid var(--line)}
  body .toast{bottom:28px}
}

/* desktop idle screen */
#ambient{position:fixed;inset:0;z-index:40;opacity:0;pointer-events:none;transition:opacity 1.6s ease;background:#0f1b27;overflow:hidden;cursor:none}
#ambient.on{opacity:1;pointer-events:auto}
.scenes{position:absolute;inset:0}
.amb-info{position:absolute;inset-inline-start:6vw;bottom:9vh;color:#f3f6f8;text-shadow:0 2px 24px rgba(0,0,0,.35);opacity:0;transition:opacity 2s ease}
.amb-info.show{opacity:1}
.amb-timer{position:absolute;left:50%;bottom:5vh;transform:translate(-50%,8px);width:min(620px,82vw);padding:16px 22px 14px;border-radius:20px;background:rgba(14,22,32,.62);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);color:#f2f5f8;opacity:0;transition:opacity 1.2s ease,transform 1.2s ease;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.amb-timer.show{opacity:1;transform:translate(-50%,0)}
.at-row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4)}
.at-phase{font-size:17px;font-weight:600;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at-min{font-family:var(--f-d);font-size:28px;line-height:1;white-space:nowrap}
.at-goal{font-size:15px;opacity:.75;margin-top:4px;min-height:1px}
.at-bar{margin-top:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
.at-bar i{display:block;height:100%;width:0;background:#e6c25c;border-radius:2px;transition:width 1s linear}
.amb-timer.brk .at-bar i{background:#9ec7e2}
.amb-clock{font-family:var(--f-d);font-size:clamp(72px,10vw,150px);line-height:1;direction:ltr;text-align:end}
.amb-date{font-size:22px;opacity:.85;margin-top:6px}
.amb-next{margin-top:18px;font-size:20px;max-width:46ch;opacity:.92}
.amb-next b{font-family:var(--f-d);font-weight:400}

/* minimised focus timer */
#mini[hidden]{display:none}
#mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;display:grid;grid-template-columns:auto auto;gap:2px 14px;align-items:baseline;min-width:200px;padding:10px 18px 12px;border-radius:18px;border:1px solid var(--hero-line);background:var(--hero);color:var(--hero-ink);box-shadow:0 12px 34px rgba(10,20,30,.28)}
.mini-ph{font-size:14px;font-weight:700;opacity:.85}
.mini-t{font-family:var(--f-d);font-size:24px;line-height:1;direction:ltr;font-variant-numeric:tabular-nums;justify-self:end}
.mini-bar{grid-column:1/-1;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:6px}
.mini-bar i{display:block;height:100%;width:0;background:#e6c25c}
#mini.brk .mini-bar i{background:#9ec7e2}
@media(min-width:1100px){#mini{bottom:28px}}

/* nav, toast, loading */
nav.tabs{position:fixed;inset-inline:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(var(--tabs,6),minmax(0,1fr));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
nav.tabs a{min-height:56px;display:grid;place-items:center;gap:2px;text-decoration:none;color:var(--muted);font-weight:700;font-size:12.5px;border-radius:14px;padding:4px 0;text-align:center}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current=page]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
body.setup nav.tabs{display:none}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline:16px;max-width:520px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r-sm);font-size:15px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:none}
.skel{height:72px;margin:10px 0;border-radius:var(--r-md);background:var(--sunk);animation:p 1.2s ease-in-out infinite alternate}
@keyframes p{to{opacity:.45}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.slot.just .node i{animation:pop .35s ease-out}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:520px){
  .slot,.nowline{grid-template-columns:50px 26px minmax(0,1fr)}.tl::before{inset-inline-start:62px}.slot .node i{inset-inline-start:6px}.slot .time{font-size:16px}
  .unit{grid-template-columns:minmax(0,1fr)}.u-ctl{justify-content:flex-start}.brand{display:none}
  .sg{grid-template-columns:minmax(0,1fr)}
  .ambbtn{display:none}
}

/* ---------- polish layer v0.2: softer surfaces, the landscape band, small moments ---------- */
:root{--sh-1:light-dark(rgba(27,52,80,.05),rgba(0,0,0,.25));--sh-2:light-dark(rgba(27,52,80,.13),rgba(0,0,0,.45));
--line-soft:light-dark(#e3e9ee,#252f3b);--frost:light-dark(rgba(255,255,255,.62),rgba(22,30,40,.55));
--shadow:0 1px 2px var(--sh-1),0 10px 28px -14px var(--sh-2);--shadow-up:0 2px 4px var(--sh-1),0 18px 40px -16px var(--sh-2);
--ease:cubic-bezier(.2,.7,.2,1)}
.card,.course,.week,.q,.card-sec,.dlist,.tool,.rev,.goal,.next.calm,.sg,.empty{border-color:var(--line-soft);box-shadow:var(--shadow)}
.pill,.days,.toggle{box-shadow:0 1px 2px var(--sh-1)}
.next{box-shadow:var(--shadow-up)}
.card,.course,.q,.card-sec,.rev,.sg{border-radius:18px}
.btn{transition:transform .14s var(--ease),background-color .2s,border-color .2s,color .2s,box-shadow .2s}
.btn:active,.tool:active,.pill:active,.chk:active,.day:active,.st:active{transform:scale(.96)}
@media(hover:hover){.btn:not(.primary):not(.on):hover,.tool:hover,.day:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}.btn.primary:hover{box-shadow:0 6px 18px -8px var(--accent)}.c-head:hover h3{color:var(--accent)}}
.tool,.pill,.chk,.day,.st,.c-head{transition:transform .14s var(--ease),background-color .2s,box-shadow .2s}
.tool svg{transition:transform .3s var(--ease)}@media(hover:hover){.tool:hover svg{transform:translateY(-2px)}}
.card .acts .btn,.rev .acts .btn,.sg .btn,.dl .acts .btn{min-height:40px;border-radius:999px;padding:0 16px;font-size:14.5px}
.card .acts .btn.on{box-shadow:0 4px 14px -6px var(--win)}
/* landscape band */
.horizon{position:absolute;inset:0 0 auto;height:clamp(240px,30vw,360px);overflow:hidden;z-index:0;pointer-events:none;background:linear-gradient(180deg,var(--scene-sky),var(--bg))}
.horizon svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.4s ease}
.horizon.ready svg{opacity:1}
.horizon::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,transparent 30%,color-mix(in srgb,var(--bg) 62%,transparent) 66%,var(--bg) 100%)}
.wrap{position:relative;z-index:1}
.top{background:var(--frost);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid color-mix(in srgb,var(--surface) 55%,transparent);border-radius:20px;padding:6px 8px;padding-inline-end:14px;box-shadow:0 6px 24px -14px var(--sh-2)}
.top .date{color:var(--ink);opacity:.8}
.top .ambbtn{border:0;background:transparent;min-height:38px}
.hello{margin:clamp(72px,15vw,150px) 2px 18px;text-shadow:0 1px 18px var(--bg)}
body.setup .hello{margin-top:clamp(72px,15vw,150px)}
/* today layout: next-up and tools, then the day, then the week */
.todaygrid{display:grid;gap:0 var(--s7);grid-template-areas:"top" "main" "more"}
.side-top{grid-area:top}.main{grid-area:main}.side-more{grid-area:more}
.more-h{display:block}
@media(min-width:1100px){.todaygrid{grid-template-columns:420px minmax(0,1fr);grid-template-areas:"top main" "more main";grid-template-rows:auto 1fr;align-items:start}.more-h{display:none}.main{grid-row:1/span 2}}
/* day progress ring */
.ring-p{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:14.5px;white-space:nowrap}
.ring-p svg{width:34px;height:34px;transform:rotate(-90deg)}
.ring-p circle{fill:none;stroke-width:4}
.ring-p .bg{stroke:var(--sunk)}.ring-p .fg{stroke:var(--win);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.ring-p b{font-family:var(--f-d);font-weight:400;color:var(--ink);font-size:16px}
/* win burst on the timeline node */
.burst{position:absolute;inset-inline-start:16px;top:23px;width:0;height:0}
.burst i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--win);opacity:0;animation:burst .75s var(--ease) forwards;transform:rotate(calc(var(--i) * 45deg))}
.burst i:nth-child(odd){background:var(--c);width:5px;height:5px}
@keyframes burst{0%{opacity:1;transform:rotate(calc(var(--i) * 45deg)) translateY(0) scale(1)}100%{opacity:0;transform:rotate(calc(var(--i) * 45deg)) translateY(-26px) scale(.4)}}
.slot.just .card{animation:glow 1s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--win) 70%,transparent),var(--shadow)}100%{box-shadow:0 0 0 14px transparent,var(--shadow)}}
.pill[aria-pressed=true] .ck{animation:pop .35s ease-out}
/* friendly empty states */
.empty{display:grid;justify-items:center;gap:10px;padding:28px 20px;border-style:solid;background:linear-gradient(180deg,color-mix(in srgb,var(--scene-sky) 35%,var(--surface)),var(--surface) 70%)}
.empty .art{width:84px;height:56px}
.empty p{margin:0;max-width:40ch;line-height:1.5}
/* screen change */
#view.enter{animation:rise .38s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* tab bar */
nav.tabs a{transition:color .2s,background-color .25s}
nav.tabs a[aria-current=page] svg{transform:translateY(-1px);stroke-width:2.1}
nav.tabs svg{transition:transform .25s var(--ease)}
.note{background:light-dark(color-mix(in srgb,var(--win) 30%,var(--surface)),color-mix(in srgb,var(--win) 13%,var(--surface)));border:1px solid color-mix(in srgb,var(--win) 35%,transparent)}
.toast{border-radius:16px;box-shadow:0 14px 34px -12px rgba(0,0,0,.35);font-weight:600}
.next .acts .btn.primary{box-shadow:0 8px 22px -10px var(--win)}
.week b{font-size:26px}
.sec{font-size:20px}
@media(max-width:520px){.hello{font-size:30px}.next{border-radius:20px}}
</style>
