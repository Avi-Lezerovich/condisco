schema_version: "1.0"
name: feedback-trigger-he
description: trigger check for study-feedback
tags: [study-feedback, trigger]
execution:
  prompt: "אני רוצה לתת פידבק על Condisco"
  max_turns: 8
runs: 1
graders:
  - type: tool_used
    name: fired-study-feedback
    tool: Skill
    input_match: "study-feedback"
    min: 1
    arm: with-only
  - type: llm
    name: behaviour
    criteria: "The reply asks at most 4 short questions in one message (a 1-5 rating, what worked, what broke, one wish) and does not send anything anywhere."
