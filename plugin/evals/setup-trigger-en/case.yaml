schema_version: "1.0"
name: setup-trigger-en
description: study-setup fires on a setup request
tags: [study-setup, trigger]
execution:
  prompt: "I just installed Condisco, what do I do first?"
  max_turns: 8
runs: 1
graders:
  - type: tool_used
    name: fired-study-setup
    tool: Skill
    input_match: "study-setup"
    min: 1
    arm: with-only
  - type: llm
    name: behaviour
    criteria: "The reply begins the Condisco setup flow: it says the private app is published first, then the courses are read from Moodle or uploaded syllabi, then a short interview. Any message asks no more than 4 short questions. It does not invent courses, dates or grades. If this session has no artifact or db tools, it is enough that the reply says setup needs them and names publishing the private app as the first step."
