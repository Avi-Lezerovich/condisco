schema_version: "1.0"
name: exam-readiness
description: behaviour check for exam-mode readiness rule
tags: [exam-mode, trigger]
execution:
  prompt: "Am I ready for my Finance exam? My last two timed mock exams were 78 and then 88. Target is 85."
  max_turns: 8
runs: 1
graders:
  - type: tool_used
    name: fired-exam-mode
    tool: Skill
    input_match: "exam-mode"
    min: 1
    arm: with-only
  - type: llm
    name: behaviour
    criteria: "The reply says the student is not yet ready by the rule of two consecutive timed mocks at or above 85 (78 is below 85), recommends at least one more timed mock from a real past exam, and does not invent other scores or an exam date."
