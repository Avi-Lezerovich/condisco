schema_version: "1.0"
name: exam-no-trigger
description: no check for exam-mode
tags: [exam-mode, no]
execution:
  prompt: "Write me a haiku about autumn."
  max_turns: 8
runs: 1
graders:
  - type: tool_used
    name: not-fired-exam-mode
    tool: Skill
    input_match: "exam-mode"
    min: 0
    max: 0
  - type: llm
    name: behaviour
    criteria: "The reply is a haiku about autumn and does not mention exams or study plans."
