schema_version: "1.0"
name: exam-untimed-not-ready
description: behaviour check for exam-mode, untimed mocks never count toward readiness
tags: [exam-mode, trigger]
execution:
  prompt: "My last two practice exams for Linear Algebra were 92 and 95, but I did them at home without a timer and with my notes open. Target is 85. Am I ready for the exam?"
  max_turns: 8
runs: 1
graders:
  - type: tool_used
    name: fired-exam-mode
    tool: Skill
    input_match: "exam-mode"
    min: 1
    arm: with-only
  - type: llm
    name: behaviour
    criteria: "The reply says the student is not yet ready (or readiness is not measured yet) because untimed, open-notes mocks do not count; it states the rule of two consecutive timed mocks at or above 85 and recommends a timed, closed-book mock from a real past exam. It does not invent an exam date or other scores."
