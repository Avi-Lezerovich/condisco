schema_version: "1.0"
name: session-trigger-he
description: trigger check for study-session (Hebrew) and session opening
tags: [study-session, trigger]
execution:
  prompt: "בוא נלמד הסתברות מותנית, יש לי 45 דקות"
  max_turns: 8
runs: 1
graders:
  - type: tool_used
    name: fired-study-session
    tool: Skill
    input_match: "study-session"
    min: 1
    arm: with-only
  - type: llm
    name: behaviour
    criteria: "The reply opens a study session: sets a one-line goal and starts with a retrieval question the student must answer, rather than lecturing the whole topic at once."
